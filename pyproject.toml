[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-avalon-mvp"
version = "0.1.0"
description = "A minimal human + LLM agent, card-based terminal Avalon game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0,<2"]

[project.optional-dependencies]
eval = ["pytest>=8,<9", "matplotlib>=3.8,<4", "numpy>=1.25,<3"]

[project.scripts]
avalon = "avalon.terminal:main"

[tool.setuptools.packages.find]
include = ["avalon*"]

[tool.setuptools.data-files]
"share/terminal-avalon-mvp" = ["prompts/corrupted_castle_system.md"]
